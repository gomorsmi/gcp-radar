[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-radar"
version = "0.1.12"
description = "GCP resource inventory scanner and draw.io architecture diagram generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Mor Michaeli", email = "mor.michaelis@gmail.com" }
]
keywords = ["gcp", "google-cloud", "inventory", "architecture", "drawio", "diagrams"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "google-cloud-compute>=1.14.0",
  "google-api-python-client>=2.0.0",
  "google-cloud-functions>=1.5.0",
  "google-cloud-container>=2.35.0",
  "google-cloud-storage>=2.14.0",
  "google-cloud-run>=0.10.0",
  "google-cloud-firestore>=2.14.0",
  "google-cloud-pubsub>=2.20.0",
  "google-cloud-monitoring>=2.17.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "build",
  "twine",
]

[project.urls]
Homepage   = "https://pypi.org/project/gcp-radar/"
Repository = "https://pypi.org/project/gcp-radar/"

[project.scripts]
gcp-radar = "gcp_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["gcp_radar"]
omit   = ["tests/*"]
